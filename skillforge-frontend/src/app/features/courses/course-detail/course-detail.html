<div *ngIf="course; else notFound">

  <h1>{{ course.title }}</h1>

  <p>{{ course.description }}</p>

  <span class="badge" [ngClass]="course.status">
    {{ course.status }}
  </span>

  <br /><br />

  <a routerLink="/courses">← Back to courses</a>

</div>

<ng-template #notFound>
  <p>Course not found.</p>
  <a routerLink="/courses">← Back to courses</a>
</ng-template>
