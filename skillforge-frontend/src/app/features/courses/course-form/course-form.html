<h1>{{ isEdit ? 'Edit course' : 'Add new course' }}</h1>

<form (ngSubmit)="submit()" #f="ngForm">

  <input
    type="text"
    name="title"
    [(ngModel)]="course.title"
    placeholder="Title"
    required
  />

  <br /><br />

  <textarea
    name="description"
    [(ngModel)]="course.description"
    placeholder="Description"
    required
  ></textarea>

  <br /><br />

  <select name="status" [(ngModel)]="course.status">
    <option value="planned">Planned</option>
    <option value="active">Active</option>
    <option value="completed">Completed</option>
  </select>

  <br /><br />

  <button type="submit" [disabled]="f.invalid">
    {{ isEdit ? 'Update' : 'Save' }}
  </button>

  <a routerLink="/courses">Cancel</a>

</form>
