<h1>Courses</h1>

<button class="add-btn" routerLink="/courses/new">
  Add course
</button>


<ul class="course-list">
  <li class="course-card" *ngFor="let course of courses">
    <h3>
      <a [routerLink]="['/courses', course.id]">
        {{ course.title }}
      </a>
    </h3>

    <p>{{ course.description }}</p>

    <span
      class="badge"
      [ngClass]="course.status"
    >
      {{ course.status }}
    </span>
  </li>
</ul>
